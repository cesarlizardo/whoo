name: Compilar Whoo para Windows

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar FFmpeg
      run: choco install ffmpeg

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install openai-whisper sounddevice scipy numpy pynput torch customtkinter pyinstaller

    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --name="Whoo" dictado_guii.py

    - name: Subir ejecutable compilado
      uses: actions/upload-artifact@v3
      with:
        name: Whoo-Windows
        path: dist/Whoo/
