name: Compilar ejecutable para Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow customtkinter sounddevice numpy torch pynput

    - name: Convertir logo a formato .ico
      run: |
        python -c "from PIL import Image; img = Image.open('logo.png'); img.save('logo.ico', format='ICO')"

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --onefile --icon=logo.ico --add-data "logo.png;." --name="Whoo" dictado_guii.py

    - name: Subir ejecutable como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Whoo-Windows-Exe
        path: dist/Whoo.exe

